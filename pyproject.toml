[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aelayer"
version = "0.1.0"
description = "Adverse event evidence layer: source-faithful canonical AE records, derived episodes, and versioned phenotype definitions over completed-trial AE data (synthetic)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.9",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.26"]

[project.scripts]
aelayer = "aelayer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["aelayer"]
omit = ["*/__main__.py"]
