# v2 is a new file, not an edit of v1.
#
# Two substantive changes, both of which move the cohort:
#
#   * the corroborating glucose threshold moves from the ADA Level 1 alert
#     value of 70 mg/dL to the Level 2 value of 54;
#   * `explicit` now additionally requires a symptom, so that a coded term
#     alone no longer satisfies a definition whose label says "symptomatic".
#
# v1 remains on disk, frozen, runnable and replayable. A cohort built under v1
# is not rewritten by the existence of v2.

id: te_symptomatic_hypoglycemia
version: 2
status: frozen
label: Treatment-emergent symptomatic hypoglycemia (Level 2, symptom required)
operates_on: episode
description: >
  Symptomatic hypoglycemia with onset within 14 days of a documented dose
  escalation. A coded term must be accompanied by a documented symptom, and a
  corroborating glucose value must meet the ADA Level 2 threshold.
supersedes: te_symptomatic_hypoglycemia.v1
authors: ["clinical-evidence-prototype"]
created: 2026-09-01

concept:
  primary: HYPOGLYCEMIA
  bridge_dictionary_versions: true

evidence_rules:
  - id: explicit
    state: explicit
    description: A coded term for the concept, with a documented symptom.
    when:
      all:
        - coded_term_matches_concept: true
        - symptoms: {min_count: 1, from: [neuroglycopenic, autonomic]}

  - id: supported
    state: supported
    description: >
      A glucose value at or below the Level 2 threshold together with at least
      one compatible clinical feature.
    when:
      all:
        - lab: {test: GLUCOSE, op: "<", value: 54, unit: mg/dL}
        - symptoms: {min_count: 1, from: [neuroglycopenic, autonomic]}

  - id: insufficient
    state: insufficient
    description: Compatible features without confirmation. Adjudicated, not discarded.
    when:
      symptoms: {min_count: 1, from: [neuroglycopenic, autonomic]}

anchor: {event: dose_escalation, source_domain: EX, index_rule: first_occurrence}
window: {unit: days, min: 0, max: 14, on_unresolved_onset: review}

missingness:
  treat_as_absent: []
  route_to_review: [pending_ongoing, unknown, not_representable]

episode:
  require_linkage_confidence: 0.8
  on_review_required: review

case_definition:
  primary: [explicit, supported]
  review: [insufficient]
  excluded: [absent, none]

reporting:
  counts_by_state: true
  require_evidence_span: true
  report_review_set_separately: true
