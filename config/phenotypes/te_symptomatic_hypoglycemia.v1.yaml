id: te_symptomatic_hypoglycemia
version: 1
status: frozen                       # draft | frozen | superseded
label: Treatment-emergent symptomatic hypoglycemia
description: >
  Symptomatic hypoglycemia with onset within 14 days of a documented
  dose escalation, in completed cardiometabolic studies.
supersedes: null
authors: ["clinical-evidence-prototype"]
created: 2026-08-31

concept:
  primary: HYPOGLYCEMIA
  include_coded_terms: true
  include_lexicon: true

assertion:
  require: [present]
  route_to_review: [uncertain]
  exclude: [absent, hypothetical, historical, family_history]

anchor:
  event: dose_escalation
  source_domain: EX
  index_rule: first_occurrence       # first_occurrence | most_recent_before_onset

window:
  unit: days
  min: 0
  max: 14
  on_unresolved_onset: review        # case | review | exclude

evidence_rules:                      # ordered; first match assigns the state
  - id: explicit
    state: explicit
    description: A coded term or an asserted verbatim mention of the concept.
    when:
      any:
        - coded_term_matches_concept: true
        - lexicon_match: {assertion: present}

  - id: supported
    state: supported
    description: >
      No explicit mention, but a qualifying glucose value together with at
      least one compatible clinical feature.
    when:
      all:
        - lab: {test: GLUCOSE, op: "<", value: 70, unit: mg/dL}
        - symptoms: {min_count: 1, from: [neuroglycopenic, autonomic]}

  - id: possible
    state: possible
    description: >
      Clinical features plus contextual evidence of management, without
      confirmation by value or explicit term.
    when:
      all:
        - symptoms: {min_count: 1, from: [neuroglycopenic, autonomic]}
        - any:
            - rescue_treatment: true
            - action_taken: [dose_reduced, dose_interrupted, drug_withdrawn]

case_definition:
  primary_set: [explicit, supported]
  review_set: [possible]
  excluded: [absent, none]

reporting:
  counts_by_state: true
  require_evidence_span: true
  report_review_set_separately: true
