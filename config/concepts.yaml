# Concept catalogue, modifier catalogues, and dictionary versions.
#
# ILLUSTRATIVE PLACEHOLDERS. This repository holds no terminology licence and
# ships no licensed dictionary content. The coded strings below are stand-ins
# with the right *shape* — several legitimate codings of one clinical
# situation, and a code that is renamed between versions while another
# disappears — so that concept-set membership and version reconciliation can be
# exercised. Replace them with a licensed extract before any real use.

dictionaries:
  name: PLACEHOLDER-DICT
  versions: ["D-19.0", "D-20.0", "D-21.0"]
  target: "D-21.0"
  notice: >
    Illustrative placeholder terms. Not licensed dictionary content.

concepts:
  # Two legitimate codings of the same clinical situation. Nothing merges them:
  # the phenotype's concept set decides that both qualify.
  RASH:
    label: Rash
    codes:
      "D-19.0": "Rash"
      "D-20.0": "Rash"
      "D-21.0": "Rash"
    lexicon: [rash, eruption, skin rash, exanthem]

  RASH_ERYTHEMATOUS:
    label: Rash erythematous
    # Renamed between D-20.0 and D-21.0. A code that persists across versions
    # remaps mechanically; nothing about that decision involves a model.
    codes:
      "D-19.0": "Rash erythematous"
      "D-20.0": "Rash erythematous"
      "D-21.0": "Erythematous rash"
    lexicon: [erythematous rash, red rash, erythematous eruption]

  RASH_MACULOPAPULAR:
    label: Rash maculopapular
    # Deliberately absent from the target version: this is the code that gets
    # flagged for review rather than auto-recoded.
    codes:
      "D-19.0": "Rash maculopapular"
      "D-20.0": "Rash maculopapular"
    lexicon: [maculopapular rash, morbilliform rash]

  PRURITUS:
    label: Pruritus
    codes:
      "D-19.0": "Pruritus"
      "D-20.0": "Pruritus"
      "D-21.0": "Pruritus"
    lexicon: [pruritus, itching, itch]

  NAUSEA:
    label: Nausea
    codes:
      "D-19.0": "Nausea"
      "D-20.0": "Nausea"
      "D-21.0": "Nausea"
    lexicon: [nausea, nauseated, feeling sick]

  NEUTROPENIA:
    label: Neutropenia
    codes:
      "D-19.0": "Neutropenia"
      "D-20.0": "Neutropenia"
      "D-21.0": "Neutropenia"
    lexicon: [neutropenia, low neutrophils, neutrophil count decreased]

concept_groups:
  CUTANEOUS:
    label: Cutaneous events
    members: [RASH, RASH_ERYTHEMATOUS, RASH_MACULOPAPULAR, PRURITUS]

# --------------------------------------------------------------------------
# Modifier catalogues
#
# The normalized value space a phenotype rule is written against. Every route
# — a structured qualifier, a linked form, the reported term, a comment —
# resolves into the same space, which is the only reason a route-agnostic rule
# is possible at all.
# --------------------------------------------------------------------------

modifiers:
  mucosal_involvement:
    label: Mucosal involvement
    description: >
      Involvement of a mucous membrane. Its `assertion` is what the source says
      (present / absent / uncertain); its `value`, where one is stated, is which
      mucosal site.
    values:
      ORAL:
        label: Oral mucosa
        surface_forms: ["oral mucosal involvement", "oral mucosa",
                        "mucosal lesions of the mouth", "mucosal involvement of the mouth",
                        "oral ulceration", "oral ulcers", "buccal erosions",
                        "mouth ulceration", "stomatitis"]
      OCULAR:
        label: Ocular mucosa
        surface_forms: ["ocular involvement", "conjunctival involvement",
                        "conjunctivitis", "eye involvement"]
      GENITAL:
        label: Genital mucosa
        surface_forms: ["genital involvement", "genital erosions",
                        "genital ulceration"]
      UNSPECIFIED:
        label: Mucosa, site unspecified
        surface_forms: ["mucosal involvement", "mucous membrane involvement",
                        "mucosal lesions", "mucosal erosions",
                        "mucous membranes involved"]

  photosensitivity:
    label: Photosensitivity
    description: >
      A second configured modifier, so nothing in the code is specific to
      mucosal involvement.
    values:
      PRESENT:
        label: Photosensitive
        surface_forms: ["photosensitivity", "photosensitive", "sun-exposed areas",
                        "photodistributed"]
