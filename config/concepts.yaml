# Concept catalogue.
#
# ILLUSTRATIVE PLACEHOLDERS. This repository holds no terminology licence and
# ships no licensed dictionary content. The coded terms below are stand-ins with
# the right *shape* — a preferred term, lower-level terms, and different sets
# under different dictionary versions — so that dictionary-version bridging can
# be exercised. Replace them with a licensed extract before any real use.
#
# The catalogue is also where surface forms are declared. Extraction recall is
# exactly the surface forms written here, and no more.

terminology:
  dictionary: PLACEHOLDER-MedDRA-like
  versions: ["24.0", "25.1", "26.0"]
  notice: >
    Illustrative placeholder terms. Not licensed dictionary content.

concepts:
  RASH:
    label: Rash
    recurrence_expected: true
    coded_terms:
      pt: ["Rash"]
      llt: ["Rash", "Skin rash", "Eruption"]
      # Terminology moves between versions. A study coded under 24.0 carries a
      # different set from one coded under 26.0, which is what makes
      # `bridge_dictionary_versions` a measurable choice rather than a default.
      by_dictionary_version:
        "24.0": ["Rash", "Skin rash"]
        "25.1": ["Rash", "Skin rash", "Eruption"]
        "26.0": ["Rash", "Skin rash", "Eruption", "Rash generalised"]
    lexicon: [rash, eruption, skin rash, exanthem]
    abbreviations: []
    # None of the coded terms above carries a body site. That is the point of
    # the worked example: where no available term includes both the event and
    # the site, the event term is selected and the site survives elsewhere.
    carries_body_site: false

  URTICARIA:
    label: Urticaria
    recurrence_expected: true
    coded_terms:
      pt: ["Urticaria"]
      llt: ["Urticaria", "Hives"]
    lexicon: [urticaria, hives, weals, wheals]
    abbreviations: []
    carries_body_site: false

  PRURITUS:
    label: Pruritus
    recurrence_expected: true
    coded_terms:
      pt: ["Pruritus"]
      llt: ["Pruritus", "Itching"]
    lexicon: [pruritus, itching, itch]
    abbreviations: []
    carries_body_site: false

  NAUSEA:
    label: Nausea
    recurrence_expected: true
    coded_terms:
      pt: ["Nausea"]
      llt: ["Nausea", "Feeling sick"]
    lexicon: [nausea, nauseated, feeling sick]
    abbreviations: []
    carries_body_site: false

  HEADACHE:
    label: Headache
    recurrence_expected: true
    coded_terms:
      pt: ["Headache"]
      llt: ["Headache", "Cephalgia"]
    lexicon: [headache, cephalgia]
    abbreviations: []
    carries_body_site: false

  ANAEMIA:
    label: Anaemia
    # Within a study window an anaemia is one condition changing grade, not a
    # series of separate events. The episode reconciler reads this.
    recurrence_expected: false
    coded_terms:
      pt: ["Anaemia"]
      llt: ["Anaemia", "Anemia", "Low haemoglobin"]
    lexicon: [anaemia, anemia, low haemoglobin]
    abbreviations: []
    carries_body_site: false

concept_groups:
  SKIN_EVENTS:
    label: Skin and subcutaneous tissue events
    members: [RASH, URTICARIA, PRURITUS]

# --------------------------------------------------------------------------
# Attribute catalogues
#
# These are the normalized value spaces a phenotype rule is written against.
# Every route — a standard variable, a sponsor codelist, the reported term, a
# comment — resolves into the same space, which is what makes a route-agnostic
# rule possible at all.
# --------------------------------------------------------------------------

attribute_catalogues:
  location:
    label: Anatomical location
    values:
      CHEST:
        label: Chest
        region: trunk
        # Surface forms are the site itself, never a connector plus the site:
        # "on the chest" would swallow the connector the anchoring rule needs
        # to see, and score a well-connected mention as a merely adjacent one.
        surface_forms: ["chest", "anterior chest", "chest wall", "sternal",
                        "presternal", "thorax", "thoracic"]
      ABDOMEN:
        label: Abdomen
        region: trunk
        surface_forms: ["abdomen", "abdominal", "belly", "periumbilical",
                        "periumbilical area", "flank"]
      BACK:
        label: Back
        region: trunk
        surface_forms: ["back", "upper back", "lower back", "lumbar",
                        "scapular", "interscapular"]
      ARM:
        label: Arm
        region: limb
        surface_forms: ["arm", "arms", "forearm", "upper arm", "elbow",
                        "antecubital"]
      LEG:
        label: Leg
        region: limb
        surface_forms: ["leg", "legs", "thigh", "shin", "calf", "knee"]
      FACE:
        label: Face
        region: head
        surface_forms: ["face", "facial", "cheek", "forehead", "perioral"]
      GENERALISED:
        label: Generalised
        region: whole_body
        surface_forms: ["generalised", "generalized", "widespread", "diffuse",
                        "all over", "whole body", "systemic"]
    regions:
      trunk: [CHEST, ABDOMEN, BACK]
      limb: [ARM, LEG]
      head: [FACE]
      whole_body: [GENERALISED]

  laterality:
    label: Laterality
    values:
      LEFT: {label: Left, surface_forms: ["left", "left-sided", "left sided"]}
      RIGHT: {label: Right, surface_forms: ["right", "right-sided", "right sided"]}
      BILATERAL:
        label: Bilateral
        surface_forms: ["bilateral", "both sides", "bilaterally"]

  pattern:
    label: Morphological pattern
    values:
      MACULAR:
        label: Macular
        surface_forms: ["macular", "macules", "flat red patches"]
      PAPULAR:
        label: Papular
        surface_forms: ["papular", "papules", "raised bumps"]
      MACULOPAPULAR:
        label: Maculopapular
        surface_forms: ["maculopapular", "maculo-papular", "morbilliform"]
      URTICARIAL:
        label: Urticarial
        surface_forms: ["urticarial", "hives", "weals", "wheals"]
      VESICULAR:
        label: Vesicular
        surface_forms: ["vesicular", "vesicles", "blistering", "bullous"]

symptom_lexicon:
  itching: [itching, pruritus, itchy]
  burning: [burning, stinging]
  swelling: [swelling, oedema, edema]

# How records are grouped into episodes. Declared, not discovered.
episode_reconciliation:
  overlap_tolerance_days: 3
  recurrence_gap_days: 7
  confidence:
    explicit_continuation: 1.0
    declared_convention: 0.95
    temporal_overlap: 0.9
    gap_within_tolerance: 0.75
    recurrence_split: 0.9
    single_record: 1.0
