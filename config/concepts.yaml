# Concept catalogue.
#
# Coded terms below are ILLUSTRATIVE PLACEHOLDERS shaped to look like real
# dictionary terms. This repository holds no MedDRA licence and ships no MedDRA
# content. Replace this file with a licensed extract before any real use.
#
# Grouping above the term level is an explicit, named list (`concept_groups`).
# No hierarchy is walked as though it implied subsumption.

concepts:
  HYPOGLYCEMIA:
    label: Hypoglycemia
    # Two hypoglycemia records three days apart are plausibly two episodes, not
    # one evolving episode. Where recurrence is expected, adjacent records stay
    # separate unless a record explicitly declares continuation.
    recurrence_expected: true
    coded_terms:
      pt: ["Hypoglycaemia", "Blood glucose decreased"]
      llt: ["Hypoglycemia", "Low blood sugar", "Hypoglycaemic episode",
            "Blood sugar low"]
      # Terminology moves between dictionary versions. Bridging is an explicit
      # union across the versions listed here, enabled per definition by
      # `bridge_dictionary_versions`; it is never inferred.
      by_dictionary_version:
        "MedDRA 21.1":
          pt: ["Hypoglycaemic episode"]
          llt: ["Low blood sugar episode", "Sugar low"]
        "MedDRA 23.0":
          pt: ["Hypoglycaemia", "Hypoglycaemic episode"]
          llt: ["Low blood sugar"]
    lexicon:
      - hypoglycemia
      - hypoglycaemia
      - hypoglycemic episode
      - hypoglycaemic episode
      - low blood sugar
      - low blood glucose
    abbreviations: ["hypo", "hypos"]
    context_required: [abbreviations]
    context_gate:
      lab_tests: [GLUCOSE]
      symptom_sets: [neuroglycopenic, autonomic]
      scope: sentence
    candidate_evidence:
      symptom_sets: [neuroglycopenic, autonomic]
      min_symptoms: 1
      lab_tests:
        # Wider than any case threshold a definition uses, so the extractor
        # narrows the field without pre-empting the definition's decision.
        - {test: GLUCOSE, below: 80, unit: mg/dL}

  HYPERGLYCEMIA:
    label: Hyperglycemia
    recurrence_expected: true
    coded_terms:
      pt: ["Hyperglycaemia", "Blood glucose increased"]
      llt: ["Hyperglycemia", "High blood sugar"]
    lexicon: [hyperglycemia, hyperglycaemia, high blood sugar, elevated blood glucose]
    abbreviations: []

  NAUSEA:
    label: Nausea
    recurrence_expected: true
    coded_terms:
      pt: ["Nausea"]
      llt: ["Nausea", "Feeling sick"]
    lexicon: [nausea, nauseated, feeling sick]
    abbreviations: []

  HEADACHE:
    label: Headache
    recurrence_expected: true
    coded_terms:
      pt: ["Headache"]
      llt: ["Headache", "Cephalgia"]
    lexicon: [headache, cephalgia]
    abbreviations: []

  ANAEMIA:
    label: Anaemia
    # A chronic, evolving condition: successive records are the same episode
    # changing grade, not separate occurrences.
    recurrence_expected: false
    coded_terms:
      pt: ["Anaemia"]
      llt: ["Anemia", "Low haemoglobin"]
    lexicon: [anaemia, anemia, low haemoglobin, low hemoglobin]
    abbreviations: []

# How source records are grouped into episodes.
#
# The default rule is deterministic and it is wrong for recurrent conditions:
# two hypoglycemia records three days apart are plausibly two episodes, not one.
# So the rule is stated here, per concept `recurrence_expected` decides which
# way the default falls, and anything ambiguous is flagged rather than resolved.
episode_reconciliation:
  gap_days: 1                  # records this close, or overlapping, are one episode
  ambiguous_gap_days: 4        # beyond gap_days but this close: decided, and flagged
  confidence:
    explicit_continuation: 1.0     # the CRF says this record continues that one
    temporal_overlap: 0.95         # intervals actually overlap
    gap_within_tolerance: 0.85     # close enough, for a concept that does not recur
    declared_convention: 0.9       # the study declares it splits on severity change
    recurrence_split: 0.9          # kept apart because the concept recurs
    model_proposed: 0.5            # proposed where deterministic evidence ran out
    single_record: 1.0

concept_groups:
  GLYCEMIC_EVENTS:
    label: Glycaemic events (illustrative narrow grouping)
    members: [HYPOGLYCEMIA, HYPERGLYCEMIA]

symptom_sets:
  neuroglycopenic:
    - confusion
    - dizziness
    - lightheadedness
    - blurred vision
    - difficulty concentrating
    - drowsiness
    - slurred speech
  autonomic:
    - shakiness
    - tremor
    - diaphoresis
    - sweating
    - palpitations
    - pallor
    - clamminess
    - hunger
    - anxiety
  gastrointestinal:
    - nausea
    - vomiting
    - abdominal pain

symptom_lexicon:
  diaphoresis: ["diaphoresis", "diaphoretic", "profuse sweating"]
  sweating: ["sweating", "sweaty"]
  shakiness: ["shakiness", "shaky", "the shakes"]
  tremor: ["tremor", "tremulous", "trembling"]
  palpitations: ["palpitations", "racing heart", "pounding heart"]
  pallor: ["pallor", "pale", "pale appearance"]
  clamminess: ["clamminess", "clammy"]
  hunger: ["hunger", "hungry", "ravenous"]
  anxiety: ["anxiety", "anxious"]
  confusion: ["confusion", "confused", "disoriented", "disorientation"]
  dizziness: ["dizziness", "dizzy", "giddiness"]
  lightheadedness: ["lightheadedness", "light-headedness", "lightheaded", "light-headed"]
  blurred vision: ["blurred vision", "blurry vision", "vision blurring"]
  difficulty concentrating: ["difficulty concentrating", "poor concentration"]
  drowsiness: ["drowsiness", "drowsy", "somnolence"]
  slurred speech: ["slurred speech", "dysarthria"]
  nausea: ["nausea", "nauseated", "nauseous"]
  vomiting: ["vomiting", "vomited", "emesis"]
  abdominal pain: ["abdominal pain", "stomach pain", "epigastric pain"]

lab_tests:
  GLUCOSE:
    label: Blood glucose
    names: ["glucose", "blood glucose", "capillary glucose", "plasma glucose",
            "fingerstick glucose", "BG", "CBG"]
    canonical_unit: mg/dL
    conversions:
      mmol/L: 18.0182
      mg/dL: 1.0
    plausible_range: [10, 900]
  HBA1C:
    label: Haemoglobin A1c
    names: ["hba1c", "haemoglobin a1c", "hemoglobin a1c", "a1c"]
    canonical_unit: "%"
    conversions: {"%": 1.0}
    plausible_range: [3, 20]
