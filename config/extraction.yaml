# Extraction configuration.
#
# The default backend is a deterministic lexicon-and-scope extractor, so
# everything runs offline. Its recall is exactly the surface forms declared in
# concepts.yaml plus the cues below — a property of the configuration, not of
# the method, and the README says so.

version: extract-4.0.0

# Where the model path is allowed to read. Anything not listed it never sees;
# `guards.py` enforces it and a structured source cannot even be declared here.
readable_sources:
  - reported_term
  - comment

# Modifiers the model path may be asked about. A structured qualifier is never
# on this list: a value the CRF settled is not a question.
extractable_modifiers: [mucosal_involvement, photosensitivity]

assertion:
  # A modifier mention is anchored to a concept mention in the same sentence,
  # and its assertion is decided by the cues that govern it. Absence of a
  # negation cue is not evidence of presence — it is the default only because
  # a clinician writing the phrase at all is asserting it.
  scope: sentence
  default: present
  max_distance_tokens: 12
  cues:
    absent:
      pre: ["no ", "without", "no evidence of", "absence of", "negative for",
            "denies", "free of", "sparing of", "not involving", "no associated"]
      post: ["was absent", "were absent", "was not present", "was spared",
             "were spared", "not observed", "was excluded"]
    uncertain:
      pre: ["possible", "possibly", "suspected", "query", "cannot exclude",
            "cannot be excluded", "equivocal", "questionable", "?"]
      post: ["cannot be excluded", "is uncertain", "remains unclear",
             "could not be confirmed"]
  # Phrases that contain a cue token but assert nothing about the modifier.
  pseudo_cues: ["no change", "no dose change", "not otherwise specified",
                "no further action", "without delay"]
  terminators: ["but", "however", "although", ";"]

confidence:
  structured_direct: 1.0
  linked_form: 1.0
  # An extraction's confidence reflects how the mention was anchored, not how
  # plausible the value looks.
  direct_phrase: 0.95        # "rash with oral mucosal involvement"
  same_sentence: 0.78        # the mention and the event share a sentence
  comment_record: 0.85       # a comment written about this record
  negated: 0.9               # a cue governs the mention explicitly
  uncertain: 0.55            # the source itself hedges
  extraction_default: 0.8

anchors:
  first_exposure:
    domain: EX
    rule: first_record
    date_field: EXSTDTC
  dose_escalation:
    domain: EX
    rule: dose_increase
    date_field: EXSTDTC
default_anchor: first_exposure
