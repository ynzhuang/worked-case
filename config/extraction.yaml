# Extraction configuration.
#
# The default backend is a deterministic lexicon-and-pattern extractor, so
# everything runs offline. Its recall is exactly the surface forms declared in
# concepts.yaml plus the patterns below — that is a property of the config, not
# of the method, and the README says so.

version: extract-3.0.0

# Where the model path is allowed to read. Anything not listed here it never
# sees; `guards.py` enforces it.
readable_sources:
  - reported_term
  - comment

# Attributes the model path may be asked about. A standard structured variable
# is never on this list: a value the CRF settled is not a question.
extractable_attributes: [location, laterality, pattern, quality]

modifiers:
  # A modifier mention is anchored to a concept mention in the same text, so
  # "rash on chest, prior eczema on the back" does not attach `back` to the
  # rash. `max_distance_tokens` is how far the anchor reaches.
  scope: sentence
  max_distance_tokens: 8
  connectors: ["on", "over", "of", "across", "involving", "affecting", "to",
               "at", "in", "along"]
  # A cue that a following site phrase does NOT belong to this event.
  disqualifiers: ["history of", "previous", "prior", "resolved", "no rash on",
                  "denies", "family history of", "unrelated"]
  confidence:
    direct_connector: 0.95      # "rash on chest"
    adjacent: 0.85              # "chest rash"
    same_sentence: 0.7          # "rash. it was on the chest"
    comment_record: 0.8

# Quality descriptors are extracted but are not a phenotype criterion here.
# They exist so the discovery path has something un-normalized to surface.
quality_lexicon:
  itchy: [itchy, pruritic, itching]
  painful: [painful, tender, sore]
  spreading: [spreading, extending, progressive]
  confluent: [confluent, coalescing]

severity:
  mild: ["mild", "mildly", "grade 1", "slight"]
  moderate: ["moderate", "moderately", "grade 2"]
  severe: ["severe", "severely", "grade 3", "grade 4", "extensive"]

# Anchors resolve against the exposure record. The window in a phenotype
# definition is measured from one of these.
anchors:
  first_exposure:
    domain: EX
    rule: first_record
    date_field: EXSTDTC
  dose_escalation:
    domain: EX
    rule: dose_increase
    date_field: EXSTDTC
default_anchor: first_exposure

confidence:
  structured_direct: 1.0
  sponsor_normalized: 0.98
  extraction_default: 0.8
  # Below this, a value is reported but routed by the definition's
  # `on_low_confidence` rather than counted.
  review_below: 0.6
