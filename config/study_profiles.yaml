# Study profiles.
#
# A profile is a collection decision. It is not a property of the patients, and
# nothing about it may be inferred at read time — a study whose profile is not
# declared cannot be read at all, because every silence in it would be
# guesswork.
#
# The generator renders a clinical truth *through* a profile; the normalizer
# reads a record *through* the same profile. One file, so the two cannot
# disagree about a study's conventions.

defaults:
  dictionary: PLACEHOLDER-DICT
  dictionary_version: "D-21.0"
  # A variable the profile does not list under `collects` was never asked for.
  # One it does list, left empty, was asked and not answered.
  silence_means: not_collected
  gated_variables:
    seriousness_criteria:
      gate: seriousness
      when_gate_false: not_applicable
  gate_values:
    seriousness:
      from_variable: AESER
      true_when_in: ["Y"]

# Where a modifier can live. `home` names the variable the generator writes it
# to and the normalizer reads it from.
modifier_homes:
  structured_qualifier:
    kind: structured_standard
    variable: AEMUCOS
    description: A standard structured qualifier on the AE record.
  linked_form:
    kind: linked_form
    variable: SC.MUCOSAL
    description: A linked skin-and-mucosa form pointing at the AE record.
  reported_term:
    kind: reported_term
    variable: AETERM
    description: The investigator's own words, where no structured field exists.
  comment:
    kind: comment
    variable: CO.COVAL
    description: A comment record pointing at the AE record.
  none:
    kind: null
    variable: null
    description: Never collected, and not recoverable from anywhere.

profiles:
  P_structured:
    label: Modifier in a structured qualifier
    study_id: STUDY-A
    reported_term_style: terse
    modifier_homes: {mucosal_involvement: structured_qualifier}
    dictionary_version: "D-21.0"
    collects: [AETERM, AEDECOD, AEMUCOS, AESEV, AEGRADE, AESER, AEREL, AEACN,
               AEOUT, AESTDTC, AEENDTC]
    note: >
      Study A in the worked example. The modifier arrives by the direct route
      and no model touches it.

  P_text:
    label: Modifier only in the reported term
    study_id: STUDY-B
    reported_term_style: rich
    modifier_homes: {mucosal_involvement: reported_term}
    dictionary_version: "D-20.0"
    prefer_concept: [RASH, RASH_ERYTHEMATOUS]
    collects: [AETERM, AEDECOD, AESEV, AEGRADE, AESER, AEREL, AEACN, AEOUT,
               AESTDTC, AEENDTC]
    note: >
      Study B. The coded term cannot carry the modifier, so it survives only in
      the investigator's own words — or not at all. Coded under D-20.0, where
      half its records remap mechanically to the target version.

  P_absent:
    label: Modifier nowhere
    study_id: STUDY-C
    reported_term_style: terse
    modifier_homes: {mucosal_involvement: none}
    dictionary_version: "D-21.0"
    collects: [AETERM, AEDECOD, AESEV, AEGRADE, AESER, AEREL, AEACN, AEOUT,
               AESTDTC, AEENDTC]
    note: >
      Study C, and the one to get right. A qualifying event with qualifying
      timing whose phenotype still cannot be evaluated. That is
      not_ascertainable, not a non_case.

  P_both:
    label: Modifier in a structured qualifier AND the reported term
    study_id: STUDY-D
    reported_term_style: mixed
    modifier_homes: {mucosal_involvement: [structured_qualifier, reported_term]}
    dictionary_version: "D-21.0"
    collects: [AETERM, AEDECOD, AEMUCOS, AESEV, AEGRADE, AESER, AEREL, AEACN,
               AEOUT, AESTDTC, AEENDTC]
    note: >
      The silver-standard evaluation set. Both routes speak independently of
      each other in the data — though not independently of the investigator,
      which is the caveat the harness prints.

  P_negated:
    label: Reported term states the modifier is absent
    study_id: STUDY-E
    reported_term_style: negated
    modifier_homes: {mucosal_involvement: reported_term}
    dictionary_version: "D-21.0"
    collects: [AETERM, AEDECOD, AESEV, AEGRADE, AESER, AEREL, AEACN, AEOUT,
               AESTDTC, AEENDTC]
    note: >
      The profile that proves the system tells a documented negative from
      silence. "Rash without mucosal involvement" is an observed absence: the
      subject belongs in the denominator as a non_case.

  P_version:
    label: Coded under an earlier dictionary version
    study_id: STUDY-F
    reported_term_style: rich
    modifier_homes: {mucosal_involvement: linked_form}
    dictionary_version: "D-19.0"
    prefer_concept: [RASH, RASH_ERYTHEMATOUS, RASH_MACULOPAPULAR]
    collects: [AETERM, AEDECOD, "SC.MUCOSAL", AESEV, AEGRADE, AESER, AEREL,
               AEACN, AEOUT, AESTDTC, AEENDTC]
    note: >
      Codes recorded under D-19.0, spread across three codings so that
      reconciling to the target version exercises all three outcomes: `Rash` is
      unchanged, `Rash erythematous` remaps mechanically to `Erythematous
      rash`, and `Rash maculopapular` has no code under the target and is
      flagged for review. Nothing is auto-recoded.

  P_concept_variant:
    label: Coded as a variant concept
    study_id: STUDY-G
    reported_term_style: rich
    modifier_homes: {mucosal_involvement: comment}
    dictionary_version: "D-21.0"
    prefer_concept: [RASH_ERYTHEMATOUS]
    collects: [AETERM, AEDECOD, "CO.COVAL", AESEV, AEGRADE, AESER, AEREL,
               AEACN, AEOUT, AESTDTC, AEENDTC]
    note: >
      Codes the same clinical situation as `Rash erythematous` rather than
      `Rash`. Both are legitimate; the concept set decides, and neither is
      rewritten.

conventions:
  P_structured:      {date_style: iso,  dose_unit: mg}
  P_text:            {date_style: iso,  dose_unit: mg}
  P_absent:          {date_style: iso,  dose_unit: mg}
  P_both:            {date_style: iso,  dose_unit: mg}
  P_negated:         {date_style: iso,  dose_unit: mg}
  P_version:         {date_style: dmy,  dose_unit: mg}
  P_concept_variant: {date_style: iso,  dose_unit: mg}
