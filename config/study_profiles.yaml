# Study profiles.
#
# A profile is a *collection decision*, not a property of the patients. The same
# clinical truth rendered under two profiles produces different records, and
# which attribute lives where is the whole subject of this prototype.
#
# The generator reads these to render a truth; the normalizer reads them to know
# what a blank means and where to look for each attribute. Both read the same
# file, so the two cannot disagree about a study's conventions.

defaults:
  dictionary: PLACEHOLDER-MedDRA-like
  dictionary_version: "25.1"
  # A blank in a variable the profile does not list under `collects` was never
  # asked for. A blank in one it does list was asked and not answered.
  blank_means: unknown
  gated_variables:
    seriousness_criteria:
      gate: seriousness
      when_gate_false: not_applicable_gated
  gate_values:
    seriousness:
      from_variable: AESER
      true_when_in: ["Y"]

# Where an attribute can live. `home` names the variable the generator writes it
# to and the normalizer reads it from.
attribute_homes:
  AELOC:
    kind: structured_standard
    variable: AELOC
    description: The optional standard location qualifier in the AE domain.
  AEPATT:
    kind: structured_standard
    variable: AEPATT
    description: A standard pattern qualifier.
  reported_term:
    kind: reported_term
    variable: AETERM
    description: The investigator's own words, where the coded term cannot carry the site.
  sponsor_variable:
    kind: structured_sponsor
    variable: SUPPAE
    description: A sponsor-defined supplemental qualifier, named by the sponsor.
  comment:
    kind: comment
    variable: CO.COVAL
    description: A comment record pointing at the AE record.
  none:
    kind: null
    variable: null
    description: Never collected, and not recoverable from anywhere.

profiles:
  P1_structured:
    label: Structured qualifiers throughout
    study_id: STUDY-P1
    reported_term_style: terse
    location_home: AELOC
    pattern_home: AEPATT
    dictionary_version: "25.1"
    collects: [AETERM, AEDECOD, AELOC, AEPATT, AESEV, AESER, AEREL, AEACN,
               AEOUT, AESTDTC, AEENDTC]
    note: >
      The easy case. Location and pattern arrive by the direct route and no
      model touches either.

  P2_text:
    label: Rich reported terms, no structured qualifiers
    study_id: STUDY-P2
    reported_term_style: rich
    location_home: reported_term
    pattern_home: reported_term
    dictionary_version: "24.0"
    collects: [AETERM, AEDECOD, AESEV, AESER, AEREL, AEACN, AEOUT, AESTDTC,
               AEENDTC]
    note: >
      The MedDRA case. "Skin rash on chest" codes to a rash term that cannot
      carry the site; nothing is coded incorrectly and the site survives only
      in the investigator's own words.

  P3_prespecified:
    label: Prespecified term list, nothing else
    study_id: STUDY-P3
    reported_term_style: prespecified
    location_home: none
    pattern_home: none
    dictionary_version: "25.1"
    collects: [AETERM, AEDECOD, AESEV, AESER, AEREL, AEACN, AEOUT, AESTDTC,
               AEENDTC]
    note: >
      The study that must return not_ascertainable. The rash is real and the
      timing qualifies; the location was never collected and is not recoverable
      from anywhere. That is not a negative case.

  P4_sponsor:
    label: Sponsor-defined supplemental qualifier
    study_id: STUDY-P4
    reported_term_style: terse
    location_home: sponsor_variable
    pattern_home: none
    sponsor_variable_name: RASHSITE
    sponsor_codelist: {CHEST: "CH", ABDOMEN: "AB", BACK: "BK", ARM: "AR",
                       LEG: "LG", FACE: "FC", GENERALISED: "GEN"}
    dictionary_version: "25.1"
    collects: [AETERM, AEDECOD, AESEV, AESER, AEREL, AEACN, AEOUT, AESTDTC,
               AEENDTC, "SUPPAE.RASHSITE"]
    note: >
      The same fact under a name no standard knows, in a codelist the sponsor
      invented. Resolving it needs a declared mapping, and the method is
      `normalized` rather than `direct` because a mapping was applied.

  P5_comment:
    label: Location in a linked comment
    study_id: STUDY-P5
    reported_term_style: terse
    location_home: comment
    pattern_home: none
    dictionary_version: "26.0"
    collects: [AETERM, AEDECOD, AESEV, AESER, AEREL, AEACN, AEOUT, AESTDTC,
               AEENDTC, "CO.COVAL"]
    note: >
      The fact is in free text, but not in the AE record at all: a CO record
      points at it. Extraction has to follow the link to find it.

  P6_both:
    label: Structured qualifier AND rich reported term
    study_id: STUDY-P6
    reported_term_style: rich
    location_home: [AELOC, reported_term]
    pattern_home: [AEPATT, reported_term]
    dictionary_version: "26.0"
    collects: [AETERM, AEDECOD, AELOC, AEPATT, AESEV, AESER, AEREL, AEACN,
               AEOUT, AESTDTC, AEENDTC]
    note: >
      The evaluation profile. The same attribute is independently present in a
      structured variable and in the reported term, which is what makes a
      silver standard possible without anyone hand-annotating anything.

# Conventions that vary independently of where attributes live.
conventions:
  P1_structured: {split_on_severity_change: false, spelling: uk, date_style: iso}
  P2_text:       {split_on_severity_change: false, spelling: us, date_style: iso}
  P3_prespecified: {split_on_severity_change: true, spelling: uk, date_style: iso}
  P4_sponsor:    {split_on_severity_change: false, spelling: us, date_style: dmy}
  P5_comment:    {split_on_severity_change: false, spelling: uk, date_style: iso}
  P6_both:       {split_on_severity_change: true, spelling: us, date_style: iso}
