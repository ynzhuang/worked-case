# How to read this study's data.
#
# This file supplies no clinical values. It governs how the deterministic path
# and the model path read the two that do: which dictionary version was in
# force, which fields were gated behind a parent question, which linked forms
# exist, which concepts the study's codelists could not express, and — most
# importantly — what a blank actually means in this study.
#
# A blank is not a value. Without this layer every empty cell collapses to
# `unknown`, and "the protocol never asked" becomes indistinguishable from "the
# site said no".

defaults:
  dictionary: MedDRA
  # Applied when a study declares nothing more specific for a field.
  blank_means: unknown
  # How a gate's answer is read off the record. Declared here so the gating
  # logic stays configuration rather than a rule buried in the normalizer.
  gate_values:
    seriousness:
      from_field: seriousness
      true_when_value: true
    outcome_final:
      from_field: outcome
      # An event that is recovering or not recovered has not ended, so its end
      # date is `pending_ongoing`, not missing.
      true_when_in: [recovered, recovered_with_sequelae, fatal]
  gated_fields:
    seriousness_criteria:
      gate: seriousness
      when_gate_false: not_applicable_gated
    end_datetime:
      gate: outcome_final
      when_gate_false: pending_ongoing
  restricted_codelists:
    action_taken:
      permissible: [dose_not_changed, dose_reduced, drug_interrupted,
                    drug_withdrawn, not_applicable, unknown]
      absent_concepts: []

studies:

  # V-A. One record per episode, everything in structured fields.
  STUDY-01:
    label: Cardiometabolic phase 3, region A
    representation: V-A
    dictionary_version: "MedDRA 26.0"
    glucose_unit: mg/dL
    record_splitting: none
    linked_forms: []
    narrative_detail: standard
    collected_fields: [verbatim_term, coded_term, onset_datetime, end_datetime,
                       severity, seriousness, relatedness, action_taken, outcome]
    note: >
      Conventional collection. One AE record per episode; the structured fields
      carry everything the analysis needs.

  # V-B. Split into multiple records on severity change.
  STUDY-02:
    label: Cardiometabolic phase 3, region B
    representation: V-B
    dictionary_version: "MedDRA 24.1"
    glucose_unit: mmol/L
    record_splitting: on_severity_change
    linked_forms: []
    narrative_detail: standard
    collected_fields: [verbatim_term, coded_term, onset_datetime, end_datetime,
                       severity, seriousness, relatedness, action_taken, outcome]
    note: >
      A worsening event is recorded as several records, one per severity grade.
      The convention is declared here, not inferred from the data.

  # V-C. Core record plus a linked event form carrying the objective value.
  STUDY-03:
    label: Phase 2b dose ranging
    representation: V-C
    dictionary_version: "MedDRA 25.0"
    glucose_unit: mg/dL
    record_splitting: none
    linked_forms: [HYPO_EVENT_FORM]
    narrative_detail: brief
    collected_fields: [verbatim_term, coded_term, onset_datetime, end_datetime,
                       severity, seriousness, action_taken, outcome]
    blank_means:
      # The protocol instructs sites to leave causality blank; it is assessed
      # centrally after database lock. That is not the same as a site being
      # asked and declining to answer, and it is not the same as the CRF never
      # having the field.
      relatedness: intentionally_blank
    note: >
      Glucose values live on a linked hypoglycaemia event form, not in the AE
      record and not in the narrative. Causality is left blank by protocol
      instruction for central assessment.

  # V-D. Minimal coding; clinical detail only in narrative.
  STUDY-04:
    label: Legacy phase 3 extension
    representation: V-D
    dictionary_version: "MedDRA 21.1"
    glucose_unit: mmol/L
    record_splitting: none
    linked_forms: []
    narrative_detail: rich
    collected_fields: [verbatim_term, onset_datetime, seriousness]
    blank_means:
      # These columns are absent from this study's CRF entirely. A blank here
      # is not an unanswered question; it is a question that was never asked,
      # and it is never evidence that nothing happened.
      severity: not_collected_by_protocol
      relatedness: not_collected_by_protocol
      action_taken: not_collected_by_protocol
      outcome: not_collected_by_protocol
      end_datetime: not_collected_by_protocol
      coded_term: not_collected_by_protocol
    note: >
      An old extension study. Severity, causality, action and outcome were
      never collected as structured fields; everything of clinical interest is
      in the narrative.

  # V-E. The action codelist has no permissible value for dose reduction.
  STUDY-05:
    label: Phase 3 open-label
    representation: V-E
    dictionary_version: "MedDRA 27.0"
    glucose_unit: mg/dL
    record_splitting: none
    linked_forms: []
    narrative_detail: standard
    collected_fields: [verbatim_term, coded_term, onset_datetime, end_datetime,
                       severity, seriousness, relatedness, action_taken, outcome]
    restricted_codelists:
      action_taken:
        permissible: [dose_not_changed, drug_interrupted, drug_withdrawn,
                      not_applicable, unknown]
        # The concept exists clinically but the field cannot express it.
        # Records where the site reduced the dose resolve to
        # `not_representable`, which is a statement about the field, not an
        # inference about what was done.
        absent_concepts: [dose_reduced]
    note: >
      This study's action-taken codelist omits dose reduction. Choosing
      `drug_interrupted` instead would assert something stronger than the
      evidence supports, so the field is left unresolved and says why.

  # V-F. An earlier dictionary version with different preferred terms.
  STUDY-06:
    label: Phase 2 crossover
    representation: V-F
    dictionary_version: "MedDRA 23.0"
    glucose_unit: mmol/L
    record_splitting: none
    linked_forms: []
    narrative_detail: standard
    collected_fields: [verbatim_term, coded_term, onset_datetime, end_datetime,
                       severity, seriousness, relatedness, action_taken, outcome]
    note: >
      Coded under an earlier dictionary whose preferred terms differ. A
      definition that does not bridge dictionary versions will undercount here.

# Linked form definitions. Which forms exist is study metadata; what they carry
# is read deterministically where the fields are controlled.
linked_forms:
  HYPO_EVENT_FORM:
    label: Hypoglycaemia event form
    fields:
      glucose_value: {type: number, unit_field: glucose_unit}
      glucose_unit: {type: string}
      symptomatic: {type: boolean}
      third_party_assistance: {type: boolean}
      rescue_given: {type: boolean}
